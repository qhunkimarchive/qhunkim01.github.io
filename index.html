<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drawing Life</title>
<style>

  body{
    background:#000;
    color:#cfcfcf;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size:16px;
    line-height:1.7;
    max-width:640px;
    margin:0 auto;
    padding:40px 20px 120px;
  }

  a{ color:#cfcfcf; }
  a:hover{ color:#fff; }

  hr{
    border:none;
    border-top:1px solid #333;
    margin:40px 0;
  }

  h1{
    color:#fff;
    font-weight:normal;
    font-size:28px;
    letter-spacing:.08em;
    text-align:center;
    margin:0 0 4px;
  }

  .subtitle{
    text-align:center;
    font-size:13px;
    letter-spacing:.15em;
    color:#777;
    text-transform:uppercase;
    margin:0 0 40px;
  }

  nav.years{
    text-align:center;
    font-size:13px;
    margin-bottom:40px;
    color:#888;
  }
  nav.years a{
    text-decoration:none;
    border-bottom:1px dotted #555;
  }
  nav.years .sep{ color:#444; margin:0 8px; }

  .year-title{
    color:#fff;
    font-weight:normal;
    font-size:15px;
    letter-spacing:.25em;
    margin:0 0 22px;
  }

  .empty-note{
    font-size:13px;
    color:#555;
    font-style:italic;
  }

  /* ---- 목록 항목 ---- */
  ul.list{
    list-style:none;
    margin:0 0 20px;
    padding:0;
  }
  ul.list li{
    margin:0 0 22px;
  }
  ul.list a.title-link{
    display:block;
    font-size:19px;
    color:#fff;
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  ul.list a.title-link:hover{
    border-bottom:1px solid #555;
  }
  ul.list .list-no{
    font-size:12px;
    letter-spacing:.1em;
    color:#666;
    display:block;
    margin-bottom:4px;
  }
  ul.list .list-date{
    font-size:12px;
    color:#777;
    display:block;
    margin-top:4px;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:#555;
    margin-top:60px;
  }

</style>
</head>
<body>

<h1 id="top">M Y &nbsp; A R C H I V E</h1>
<p class="subtitle">Personal Project Archive</p>

<!-- ==========================================================
     연도 목차(nav) — 새 연도가 생기면 여기에 링크 한 칸을
     추가하세요. href는 아래 <section id="year-XXXX"> 의 id와
     똑같아야 합니다.
     ========================================================== -->
<nav class="years">
  <a href="#year-2026">2026</a><span class="sep">·</span><a href="#year-2025">2025</a>
</nav>

<hr>

<!-- ==========================================================
     연도별 작업 목록 — 새 작업을 추가하려면:
     1) entry-XXX.html 이라는 새 파일을 만들고 (아래 개별 페이지와
        같은 형식으로 내용을 채운 뒤)
     2) 이 목록에 <li> 한 줄을 추가해서 그 파일로 링크하세요.
     ========================================================== -->

<section id="year-2026">
  <h2 class="year-title">2026</h2>

  <ul class="list">
    <li>
      <span class="list-no">NO. 001</span>
      <a class="title-link" href="entry-001.html">첫 번째 작업 제목</a>
      <span class="list-date">2026. 08</span>
    </li>
    <li>
      <span class="list-no">NO. 002</span>
      <a class="title-link" href="entry-002.html">두 번째 작업 제목</a>
      <span class="list-date">2026. 08</span>
    </li>
    <li>
      <span class="list-no">NO. 003</span>
      <a class="title-link" href="entry-003.html">세 번째 작업 제목</a>
      <span class="list-date">2026. 08</span>
    </li>
  </ul>
</section>

<hr>

<section id="year-2025">
  <h2 class="year-title">2025</h2>
  <p class="empty-note">아직 등록된 작업이 없습니다.</p>
</section>

<hr>

<footer>
  © 2026 MY ARCHIVE
</footer>

</body>
</html>
