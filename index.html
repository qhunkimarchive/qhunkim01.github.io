<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRAWING LIFE</title>
<style>

  body{
    background:#000;
    color:#cfcfcf;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-size:16px;
    line-height:1.7;
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 120px;
  }

  a{ color:#cfcfcf; }
  a:hover{ color:#fff; }

  hr{
    border:none;
    border-top:1px solid #333;
    margin:40px 0;
  }

  hr.gold{
    border-top:2px solid #c9a227;
    margin:24px 0;
  }

  h1{
    color:#c9a227;
    font-family: Helvetica, Arial, sans-serif;
    font-weight:bold;
    font-size:52px;
    letter-spacing:.06em;
    text-align:center;
    margin:0 0 10px;
  }

  .subtitle{
    text-align:center;
    font-family: Arial, Helvetica, sans-serif;
    font-size:15px;
    font-weight:bold;
    letter-spacing:.04em;
    color:#8a7d55;
    text-transform:uppercase;
    margin:0 0 30px;
  }

  nav.years{
    text-align:center;
    font-size:13px;
    margin-bottom:40px;
    color:#888;
  }
  nav.years a{
    text-decoration:none;
    border-bottom:1px dotted #555;
  }
  nav.years .sep{ color:#444; margin:0 8px; }

  .year-title{
    color:#fff;
    font-weight:normal;
    font-size:15px;
    letter-spacing:.25em;
    margin:0 0 22px;
  }

  .empty-note{
    font-size:13px;
    color:#555;
    font-style:italic;
  }

  /* ---- 목록 항목 ---- */
  ul.list{
    list-style:none;
    margin:0 0 20px;
    padding:0;
  }
  ul.list li{
    margin:0 0 22px;
  }
  ul.list a.title-link{
    display:block;
    font-size:19px;
    color:#fff;
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  ul.list a.title-link:hover{
    border-bottom:1px solid #555;
  }
  ul.list .list-no{
    font-size:12px;
    letter-spacing:.1em;
    color:#666;
    display:block;
    margin-bottom:4px;
  }
  ul.list .list-date{
    font-size:12px;
    color:#777;
    display:block;
    margin-top:4px;
  }

  .featured-image{
    display:block;
    width:100%;
    height:auto;
    margin:0 0 40px;
    border:1px solid #333;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:#555;
    margin-top:60px;
  }

</style>
</head>
<body>

<hr class="gold" style="margin-top:0;">

<h1 id="top">DRAWING LIFE</h1>
<p class="subtitle">Personal Project Archive</p>

<!-- ==========================================================
     연도 목차(nav) — 새 연도가 생기면 여기에 링크 한 칸을
     추가하세요. href는 아래 <section id="year-XXXX"> 의 id와
     똑같아야 합니다.
     ========================================================== -->
<nav class="years">
  <a href="#year-2026">2026</a><span class="sep">·</span><a href="#year-2025">2025</a>
</nav>

<hr class="gold">

<!-- ==========================================================
     대표 이미지 — 항상 "가장 최근에 추가한 작업"의 사진을
     자동으로 보여줍니다. 목록 맨 마지막 <li> 안의 링크
     (예: entry-004.html)에서 숫자를 읽어서, 같은 번호의
     사진(project-04.jpg)을 자동으로 찾아 보여줍니다.
     그래서 새 작업의 entry 번호와 사진 번호만 맞춰주면 되고,
     따로 적어줘야 하는 건 없습니다.
     ========================================================== -->
<a id="featured-link" href="#">
  <img id="featured-image" class="featured-image" src="project-01.jpg" alt="가장 최근 작업">
</a>

<!-- ==========================================================
     연도별 작업 목록 — 새 작업을 추가하려면:
     1) entry-XXX.html 이라는 새 파일을 만들고 (아래 개별 페이지와
        같은 형식으로 내용을 채운 뒤)
     2) 이 목록에 <li> 한 줄을 추가해서 그 파일로 링크하세요.
     ========================================================== -->

<section id="year-2026">
  <h2 class="year-title">2026</h2>
  <p class="empty-note">아직 등록된 작업이 없습니다.</p>
</section>

<hr>

<section id="year-2025">
  <h2 class="year-title">2025</h2>

  <ul class="list">
    <li>
      <span class="list-no">NO. 001</span>
      <a class="title-link" href="entry-001.html">첫 번째 작업 제목</a>
      <span class="list-date">2025</span>
    </li>
    <li>
      <span class="list-no">NO. 002</span>
      <a class="title-link" href="entry-002.html">두 번째 작업 제목</a>
      <span class="list-date">2025</span>
    </li>
    <li>
      <span class="list-no">NO. 003</span>
      <a class="title-link" href="entry-003.html">세 번째 작업 제목</a>
      <span class="list-date">2025</span>
    </li>
  </ul>
</section>

<hr>

<footer>
  © 2026 DRAWING LIFE
</footer>

<!-- ==========================================================
     아주 짧은 자바스크립트 한 조각 — 프레임워크나 외부 라이브러리
     없이, 목록의 맨 마지막 작업 링크(entry-XXX.html)에서 숫자를
     읽어와 같은 번호의 사진(project-XX.jpg)을 대표 이미지로
     자동 연결해줍니다. 새 항목을 추가할 때 entry 번호와 사진
     번호만 맞춰두면 이 부분은 신경 쓰지 않아도 됩니다.
     ========================================================== -->
<script>
  var links = document.querySelectorAll('ul.list a.title-link');
  if (links.length > 0) {
    var lastLink = links[links.length - 1];
    var href = lastLink.getAttribute('href');           // 예: "entry-003.html"
    var match = href.match(/(\d+)/);                    // 숫자만 추출: "003"
    if (match) {
      var num = parseInt(match[1], 10);                 // 3
      var padded = (num < 10 ? '0' : '') + num;          // "03"
      document.getElementById('featured-image').src = 'project-' + padded + '.jpg';
      document.getElementById('featured-link').href = href;
    }
  }
</script>

</body>
</html>
